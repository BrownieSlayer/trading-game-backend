spring:
  application:
    name: trading-game-backend
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    contexts: test
  security:
    user:
      name: test
      password: test

logging:
  level:
    org:
      springframework:
        security: INFO
        web: INFO
      testcontainers: INFO
    liquibase: INFO

jwt:
  secret: OFnuJBYJC04pOZA0URQL69j4GZQywbGYm7PXAigbD7c=
  expiration: 86400000

cors:
  allowed-origins: http://localhost:4200